[package]
name = "yarn-berry-fetcher"
version = "1.0.1"
edition = "2024"

[dependencies]
axfive-libzip = "0.2.1"
chrono = { version = "0.4.40", default-features = false, features = ["std"] }
deko = { version = "0.4.0", default-features = false, features = ["flate2"] }
dostime = { version = "1.0.0", features = ["chrono-1"] }
hex = "0.4.3"
oxhttp = { version = "0.3.0", default-features = false, features = ["client", "native-tls"] }
rayon = "1.10.0"
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yml = "0.0.12"
sha2 = "0.10.8"
ssri = "9.2.0"
tar = "0.4.44"
tempfile = "3.19.1"
yarn-lock-parser = "0.11.0"
