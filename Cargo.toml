[package]
name = "yarn-berry-fetcher"
version = "1.2.3"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-process = "2.5.0"
async-tempfile = "0.7.0"
axfive-libzip = "0.2.3"
chrono = { version = "0.4.40", default-features = false, features = ["std"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
deko = { version = "0.4.0", default-features = false, features = ["flate2"] }
dostime = { version = "1.0.0", features = ["chrono-1"] }
form_urlencoded = "1.2.1"
futures = "0.3.32"
hex = "0.4.3"
reqwest = { version = "0.13.4", features = ["blocking", "native-tls"] }
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yml = "0.0.12"
sha2 = "0.10.8"
ssri = "9.2.0"
tar = "0.4.44"
tempfile = "3.19.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "fs", "io-std", "io-util", "macros"] }
tokio-retry2 = { version = "0.9.1", features = ["jitter", "rand"] }
tokio-util = { version = "0.7.18", features = ["io", "io-util"] }
yarn-lock-parser = "0.14.0"
